<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- WhatsApp / Telegram Inspired Chat Doodles Pattern -->
  <!-- Coffee cup -->
  <g transform="translate(24, 28)">
    <path d="M0 6h22v12a7 7 0 0 1-7 7H7a7 7 0 0 1-7-7V6z"/>
    <path d="M22 9h4a3 3 0 0 1 0 6h-4"/>
    <path d="M5 2c0-1 2-2 2-2s2 1 2 2"/>
    <path d="M12 2c0-1 2-2 2-2s2 1 2 2"/>
  </g>

  <!-- Speech bubble -->
  <g transform="translate(140, 20)">
    <path d="M4 4h26a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4h-16l-7 6v-6H4a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z"/>
    <circle cx="9" cy="15" r="1.5" fill="currentColor"/>
    <circle cx="17" cy="15" r="1.5" fill="currentColor"/>
    <circle cx="25" cy="15" r="1.5" fill="currentColor"/>
  </g>

  <!-- Paper plane -->
  <g transform="translate(260, 32)">
    <path d="M0 12l26-12-10 26-5-9-11-5z"/>
    <path d="M11 15l15-15"/>
  </g>

  <!-- Headphones -->
  <g transform="translate(30, 130)">
    <path d="M3 16a13 13 0 0 1 26 0"/>
    <rect x="0" y="14" width="6" height="10" rx="3"/>
    <rect x="26" y="14" width="6" height="10" rx="3"/>
  </g>

  <!-- Star / Sparkle -->
  <g transform="translate(160, 120)">
    <path d="M10 0l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>

  <!-- Game controller -->
  <g transform="translate(240, 120)">
    <rect x="0" y="4" width="28" height="16" rx="8"/>
    <path d="M6 12h4m-2-2v4"/>
    <circle cx="20" cy="10" r="1" fill="currentColor"/>
    <circle cx="23" cy="13" r="1" fill="currentColor"/>
  </g>

  <!-- Camera -->
  <g transform="translate(26, 230)">
    <path d="M4 6h4l2-3h8l2 3h4a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z"/>
    <circle cx="14" cy="14" r="4"/>
  </g>

  <!-- Music note -->
  <g transform="translate(130, 220)">
    <path d="M9 18V5l12-3v13"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="18" cy="15" r="3"/>
  </g>

  <!-- Heart -->
  <g transform="translate(230, 225)">
    <path d="M12 21s-8-5.3-10-9.5A5.5 5.5 0 0 1 10.5 4L12 5.5 13.5 4A5.5 5.5 0 0 1 22 11.5C20 15.7 12 21 12 21z"/>
  </g>

  <!-- Mobile phone -->
  <g transform="translate(310, 170)">
    <rect x="0" y="0" width="14" height="24" rx="3"/>
    <line x1="5" y1="20" x2="9" y2="20"/>
  </g>

  <!-- Lightbulb -->
  <g transform="translate(80, 310)">
    <path d="M7 16h6m-5 3h4m-7-9a6 6 0 1 1 10 0c-1.5 1.5-2 3-2 5H7c0-2-.5-3.5-2-5z"/>
  </g>

  <!-- Clock -->
  <g transform="translate(190, 305)">
    <circle cx="11" cy="11" r="10"/>
    <polyline points="11,5 11,11 15,13"/>
  </g>

  <!-- Smile emoji -->
  <g transform="translate(290, 290)">
    <circle cx="12" cy="12" r="11"/>
    <circle cx="8" cy="10" r="1.5" fill="currentColor"/>
    <circle cx="16" cy="10" r="1.5" fill="currentColor"/>
    <path d="M8 15a5 5 0 0 0 8 0"/>
  </g>
</svg>